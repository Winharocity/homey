# Full monolithic Home Assistant configuration for ChoreBoard
# Fixed version with corrected script names, recorder config, and improved logic

default_config:

frontend:
  themes: {}

# -----------------------
# RECORDER - Required for history graphs
# -----------------------
recorder:
  include:
    entities:
      - sensor.archie_balance_calculated
      - sensor.harry_balance_calculated
      - sensor.bella_balance_calculated
      - sensor.choreboard_completed_chores
      - sensor.choreboard_open_chores
      - sensor.choreboard_archie_open
      - sensor.choreboard_harry_open
      - sensor.choreboard_bella_open

# -----------------------
# AUTOMATIONS
# -----------------------
automation:
  - id: 'chore_completion_ui_notify'
    alias: 'Chore Completion — UI Notification'
    description: 'Send a persistent notification when any chore Completed boolean turns ON'
    trigger:
      - platform: state
        entity_id:
          - input_boolean.chore_1_done
          - input_boolean.chore_2_done
          - input_boolean.chore_3_done
          - input_boolean.chore_4_done
          - input_boolean.chore_5_done
          - input_boolean.chore_6_done
          - input_boolean.chore_7_done
          - input_boolean.chore_8_done
          - input_boolean.chore_9_done
          - input_boolean.chore_10_done
          - input_boolean.chore_11_done
          - input_boolean.chore_12_done
          - input_boolean.chore_13_done
          - input_boolean.chore_14_done
          - input_boolean.chore_15_done
          - input_boolean.chore_16_done
          - input_boolean.chore_17_done
          - input_boolean.chore_18_done
          - input_boolean.chore_19_done
          - input_boolean.chore_20_done
        to: 'on'
    condition: []
    action:
      - service: persistent_notification.create
        data:
          title: "Chore Completed"
          message: >
            {% set ent = trigger.entity_id %}
            {% set idx = ent.split('_')[2] %}
            {% set title = states('input_text.chore_' ~ idx ~ '_title') %}
            {% set child = states('input_select.chore_' ~ idx ~ '_child') %}
            {% set price = states('input_number.chore_' ~ idx ~ '_price') %}
            Chore {{ idx }} completed: "{{ title }}" ({{ child | title }}) — ${{ price }}.
    mode: queued
    max: 10

  - id: 'set_chore_completed_from_device'
    alias: "Set Chore Completed from ChoreBoard Device"
    description: "Handles /api/events/choreboard_chore_completed from ESP MCU"
    trigger:
      - platform: event
        event_type: choreboard_chore_completed
    action:
      - variables:
          data: "{{ trigger.event.data }}"
      - service: input_boolean.turn_on
        target:
          entity_id: >
            {% set target_title = data.title %}
            {% set target_owner_index = data.ownerIndex | int %}
            {% for i in range(1, 21) %}
              {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
              {% set t_name = states('input_text.chore_' ~ i ~ '_title') %}
              {% set t_child_idx = ['archie','harry','bella'].index(states('input_select.chore_' ~ i ~ '_child')) %}
              {% if enabled and t_name == target_title and t_child_idx == target_owner_index %}
                {{ 'input_boolean.chore_' ~ i ~ '_done' }}
              {% endif %}
            {% endfor %}
    mode: single


# -----------------------
# SCRIPTS
# -----------------------
script:
  # Fixed script names to match dashboard calls
  clear_completed_chores_archie:
    alias: "Clear Completed Chores - Archie"
    sequence:
      - repeat:
          count: 20
          sequence:
            - variables:
                idx: "{{ repeat.index }}"
            - if:
                - condition: template
                  value_template: >
                    {{ is_state('input_boolean.chore_' ~ idx ~ '_enable', 'on') and
                       is_state('input_select.chore_' ~ idx ~ '_child', 'archie') and
                       is_state('input_boolean.chore_' ~ idx ~ '_done', 'on') }}
              then:
                - service: input_boolean.turn_off
                  target:
                    entity_id: "input_boolean.chore_{{ idx }}_done"
      - service: persistent_notification.create
        data:
          title: "Payment Processed"
          message: "Archie's completed chores have been cleared and marked as paid."

  clear_completed_chores_harry:
    alias: "Clear Completed Chores - Harry"
    sequence:
      - repeat:
          count: 20
          sequence:
            - variables:
                idx: "{{ repeat.index }}"
            - if:
                - condition: template
                  value_template: >
                    {{ is_state('input_boolean.chore_' ~ idx ~ '_enable', 'on') and
                       is_state('input_select.chore_' ~ idx ~ '_child', 'harry') and
                       is_state('input_boolean.chore_' ~ idx ~ '_done', 'on') }}
              then:
                - service: input_boolean.turn_off
                  target:
                    entity_id: "input_boolean.chore_{{ idx }}_done"
      - service: persistent_notification.create
        data:
          title: "Payment Processed"
          message: "Harry's completed chores have been cleared and marked as paid."

  clear_completed_chores_bella:
    alias: "Clear Completed Chores - Bella"
    sequence:
      - repeat:
          count: 20
          sequence:
            - variables:
                idx: "{{ repeat.index }}"
            - if:
                - condition: template
                  value_template: >
                    {{ is_state('input_boolean.chore_' ~ idx ~ '_enable', 'on') and
                       is_state('input_select.chore_' ~ idx ~ '_child', 'bella') and
                       is_state('input_boolean.chore_' ~ idx ~ '_done', 'on') }}
              then:
                - service: input_boolean.turn_off
                  target:
                    entity_id: "input_boolean.chore_{{ idx }}_done"
      - service: persistent_notification.create
        data:
          title: "Payment Processed"
          message: "Bella's completed chores have been cleared and marked as paid."
  
  add_chore_archie:
    alias: "Add Chore for Archie"
    sequence:
      - service: script.enable_next_chore
        data:
          child: "archie"
          
  add_chore_harry:
    alias: "Add Chore for Harry"
    sequence:
      - service: script.enable_next_chore
        data:
          child: "harry"
          
  add_chore_bella:
    alias: "Add Chore for Bella"
    sequence:
      - service: script.enable_next_chore
        data:
          child: "bella"
          
  enable_next_chore:
    alias: "Enable Next Available Chore Slot"
    fields:
      child:
        description: "Which child to assign the chore to"
        example: "archie"
    sequence:
      - variables:
          child_val: "{{ child | default('archie') }}"
          next_slot: >
            {% set ranges = {'archie': (1, 7), 'harry': (8, 14), 'bella': (15, 20)} %}
            {% set bounds = ranges.get(child_val) %}
            {% set ns = namespace(found=0) %}
            {% if bounds %}
              {% for i in range(bounds[0], bounds[1] + 1) %}
                {% if ns.found == 0 and states('input_boolean.chore_' ~ i ~ '_enable') == 'off' %}
                  {% set ns.found = i %}
                {% endif %}
              {% endfor %}
            {% else %}
              {% set ns.found = -1 %}
            {% endif %}
            {{ ns.found }}
      - if:
          - condition: template
            value_template: "{{ next_slot | int > 0 }}"
        then:
          - service: input_boolean.turn_on
            target:
              entity_id: "input_boolean.chore_{{ next_slot }}_enable"
          - service: input_select.select_option
            target:
              entity_id: "input_select.chore_{{ next_slot }}_child"
            data:
              option: "{{ child_val }}"
          - service: persistent_notification.create
            data:
              title: "Chore Slot Enabled"
              message: "Chore {{ next_slot }} enabled for {{ child_val | title }}. Edit it in the Lists tab."
        else:
          - service: persistent_notification.create
            data:
              title: "No Available Slots"
              message: >
                {% if next_slot | int == -1 %}
                  Unknown child "{{ child_val }}". Use archie, harry, or bella.
                {% else %}
                  No free slots for {{ child_val | title }}. Disable one of their chores to free up a slot.
                {% endif %}

# -----------------------
# TEMPLATE SENSORS
# -----------------------
# -----------------------
# TEMPLATE SENSORS
# -----------------------
template:
  - sensor:
      # --- Balance Calculators ---
      - name: "Archie Balance Calculated"
        unique_id: archie_balance_calculated
        state: >
          {% set total = namespace(value=0.0) %}
          {% for i in range(1, 21) %}
            {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
            {% set child = is_state('input_select.chore_' ~ i ~ '_child', 'archie') %}
            {% set done = is_state('input_boolean.chore_' ~ i ~ '_done', 'on') %}
            {% if enabled and child and done %}
              {% set price = states('input_number.chore_' ~ i ~ '_price') | float(0) %}
              {% set total.value = total.value + price %}
            {% endif %}
          {% endfor %}
          {{ "%.2f" | format(total.value) }}
        unit_of_measurement: "$"
        icon: mdi:cash

      - name: "Harry Balance Calculated"
        unique_id: harry_balance_calculated
        state: >
          {% set total = namespace(value=0.0) %}
          {% for i in range(1, 21) %}
            {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
            {% set child = is_state('input_select.chore_' ~ i ~ '_child', 'harry') %}
            {% set done = is_state('input_boolean.chore_' ~ i ~ '_done', 'on') %}
            {% if enabled and child and done %}
              {% set price = states('input_number.chore_' ~ i ~ '_price') | float(0) %}
              {% set total.value = total.value + price %}
            {% endif %}
          {% endfor %}
          {{ "%.2f" | format(total.value) }}
        unit_of_measurement: "$"
        icon: mdi:cash

      - name: "Bella Balance Calculated"
        unique_id: bella_balance_calculated
        state: >
          {% set total = namespace(value=0.0) %}
          {% for i in range(1, 21) %}
            {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
            {% set child = is_state('input_select.chore_' ~ i ~ '_child', 'bella') %}
            {% set done = is_state('input_boolean.chore_' ~ i ~ '_done', 'on') %}
            {% if enabled and child and done %}
              {% set price = states('input_number.chore_' ~ i ~ '_price') | float(0) %}
              {% set total.value = total.value + price %}
            {% endif %}
          {% endfor %}
          {{ "%.2f" | format(total.value) }}
        unit_of_measurement: "$"
        icon: mdi:cash

      # --- General Counters ---
      - name: "Choreboard Open Chores"
        unique_id: choreboard_open_chores
        state: >
          {% set count = namespace(value=0) %}
          {% for i in range(1, 21) %}
            {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
            {% set done = is_state('input_boolean.chore_' ~ i ~ '_done', 'on') %}
            {% if enabled and not done %}
              {% set count.value = count.value + 1 %}
            {% endif %}
          {% endfor %}
          {{ count.value }}
        icon: mdi:clipboard-text-outline

      - name: "Choreboard Completed Chores"
        unique_id: choreboard_completed_chores
        state: >
          {% set count = namespace(value=0) %}
          {% for i in range(1, 21) %}
            {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
            {% set done = is_state('input_boolean.chore_' ~ i ~ '_done', 'on') %}
            {% if enabled and done %}
              {% set count.value = count.value + 1 %}
            {% endif %}
          {% endfor %}
          {{ count.value }}
        icon: mdi:clipboard-check-outline

      # --- Per-Child Open Counters ---
      - name: "Choreboard Archie Open"
        unique_id: choreboard_archie_open
        state: >
          {% set count = namespace(value=0) %}
          {% for i in range(1, 21) %}
            {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
            {% set child = is_state('input_select.chore_' ~ i ~ '_child', 'archie') %}
            {% set done = is_state('input_boolean.chore_' ~ i ~ '_done', 'on') %}
            {% if enabled and child and not done %}
              {% set count.value = count.value + 1 %}
            {% endif %}
          {% endfor %}
          {{ count.value }}
        icon: mdi:clipboard-list

      - name: "Choreboard Harry Open"
        unique_id: choreboard_harry_open
        state: >
          {% set count = namespace(value=0) %}
          {% for i in range(1, 21) %}
            {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
            {% set child = is_state('input_select.chore_' ~ i ~ '_child', 'harry') %}
            {% set done = is_state('input_boolean.chore_' ~ i ~ '_done', 'on') %}
            {% if enabled and child and not done %}
              {% set count.value = count.value + 1 %}
            {% endif %}
          {% endfor %}
          {{ count.value }}
        icon: mdi:clipboard-list

      - name: "Choreboard Bella Open"
        unique_id: choreboard_bella_open
        state: >
          {% set count = namespace(value=0) %}
          {% for i in range(1, 21) %}
            {% set enabled = is_state('input_boolean.chore_' ~ i ~ '_enable', 'on') %}
            {% set child = is_state('input_select.chore_' ~ i ~ '_child', 'bella') %}
            {% set done = is_state('input_boolean.chore_' ~ i ~ '_done', 'on') %}
            {% if enabled and child and not done %}
              {% set count.value = count.value + 1 %}
            {% endif %}
          {% endfor %}
          {{ count.value }}
        icon: mdi:clipboard-list


    type: masonry
  - type: sections
    title: Payment
    path: payment
    icon: mdi:cash-multiple
    cards: []
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              ## 💰 Payment Processing


              When you've paid a child for their completed chores, tap their
              button below to clear all their completed chores and reset their
              balance to $0.00.


              **Note:** This only clears the "completed" status. The chores
              remain enabled and can be completed again.
      - type: grid
        cards:
          - type: heading
            heading: 👦 Archie
            heading_style: title
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.archie_balance_calculated
                name: Current Balance
                icon: mdi:cash-multiple
                icon_color: '#5e81ac'
                primary_info: state
                secondary_info: none
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: 💵 Mark Archie as Paid
            secondary: Clear all completed chores for Archie
            icon: mdi:cash-check
            tap_action:
              action: call-service
              service: script.clear_completed_chores_archie
              confirmation:
                text: Clear all completed chores for Archie?
            color: '#5e81ac'
            features_position: bottom
            grid_options:
              columns: 9
              rows: 1
          - type: heading
            heading: 👦 Harry
            heading_style: title
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.harry_balance_calculated
                name: Current Balance
                icon: mdi:cash-multiple
                icon_color: '#5e81ac'
                primary_info: state
                secondary_info: none
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: 💵 Mark Harry as Paid
            secondary: Clear all completed chores for Harry
            icon: mdi:cash-check
            tap_action:
              action: call-service
              service: script.clear_completed_chores_harry
              confirmation:
                text: Clear all completed chores for Harry?
            color: '#5e81ac'
            features_position: bottom
            grid_options:
              columns: 9
              rows: 1
          - type: heading
            heading: 👧 Bella
            heading_style: title
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.bella_balance_calculated
                name: Current Balance
                icon: mdi:cash-multiple
                icon_color: '#5e81ac'
                primary_info: state
                secondary_info: none
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: 💵 Mark Bella as Paid
            secondary: Clear all completed chores for Bella
            icon: mdi:cash-check
            tap_action:
              action: call-service
              service: script.clear_completed_chores_bella
              confirmation:
                text: Clear all completed chores for Bella?
            color: pink
            features_position: bottom
            grid_options:
              columns: 9
              rows: 1
        column_span: 2
  - type: sections
    title: Stats
    path: stats
    icon: mdi:chart-line
    cards:
      - type: heading
        heading: Overall Completion Trend
        heading_style: title
      - type: custom:mini-graph-card
        name: Total Completed Chores (Last Week)
        entities:
          - entity: sensor.choreboard_completed_chores
            name: Completed
            color: '#4caf50'
        hours_to_show: 168
        points_per_hour: 1
        line_width: 3
        font_size: 75
        animate: true
        show:
          labels: true
          points: true
          legend: true
      - type: heading
        heading: Individual Balance Trends
        heading_style: title
      - type: heading
        heading: Current Statistics
        heading_style: title
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.choreboard_open_chores
            name: Open Chores
            icon: mdi:clipboard-list-outline
            icon_color: orange
            primary_info: state
            secondary_info: none
          - type: custom:mushroom-entity-card
            entity: sensor.choreboard_completed_chores
            name: Completed
            icon: mdi:clipboard-check
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |-
              ## 📊 ChoreBoard Statistics

              Track chore completion trends and see how everyone is doing!
          - type: custom:mini-graph-card
            name: All Kids - Balance Comparison
            entities:
              - entity: sensor.archie_balance_calculated
                name: Archie
                color: '#4caf50'
              - entity: sensor.harry_balance_calculated
                name: Harry
                color: '#2196f3'
              - entity: sensor.bella_balance_calculated
                name: Bella
                color: '#e91e63'
            hours_to_show: 168
            points_per_hour: 1
            line_width: 3
            font_size: 75
            animate: true
            show:
              labels: true
              points: false
              legend: true
      - type: grid
        cards:
          - type: entities
            title: Current Balances
            entities:
              - entity: sensor.archie_balance_calculated
                name: 👦 Archie
                icon: mdi:cash
              - entity: sensor.harry_balance_calculated
                name: 👦 Harry
                icon: mdi:cash
              - entity: sensor.bella_balance_calculated
                name: 👧 Bella
                icon: mdi:cash
          - type: entities
            title: Per-Child Open Chores
            entities:
              - entity: sensor.choreboard_archie_open
                name: 👦 Archie
                icon: mdi:clipboard-list
              - entity: sensor.choreboard_harry_open
                name: 👦 Harry
                icon: mdi:clipboard-list
              - entity: sensor.choreboard_bella_open
                name: 👧 Bella
                icon: mdi:clipboard-list

template:
  - sensor:
      - name: "Todays Energy Cost"
        unique_id: todays_energy_cost
        unit_of_measurement: "AUD"
        device_class: monetary
        state_class: measurement
        icon: mdi:currency-usd
        state: >
          {% set daily_charge     = 0.474 %}
          {% set peak_import      = states('sensor.tarrif11_peak')      | float(0) %}
          {% set shoulder_import  = states('sensor.tarrif11_shoulder')  | float(0) %}
          {% set export_high      = states('sensor.grid_export_battery')      | float(0) %}
          {% set export_low       = states('sensor.grid_export_low')       | float(0) %}
          {% set import_cost   = (peak_import * 0.462) + (shoulder_import * 0.319) %}
          {% set export_credit = (export_high * 0.15)  + (export_low * 0.06) %}
          {{ (daily_charge + import_cost - export_credit) | round(2) }}
  - sensor:
      - name: "Daily Energy Supply Charge"
        unique_id: daily_energy_supply_charge
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (((as_timestamp(states('sensor.date_time_iso')) / 3600) - 454585) | int) / 2400 }}"
        attributes:
          last_reset: '1970-01-01T00:00:00+00:00'
      - name: "ChoreBoard Data"
        unique_id: choreboard_data_sensor
        state: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
        attributes:
          chores: >
            {% set ns = namespace(chores=[]) %}
            {%- for i in range(1, 21) -%}
              {%- if states('input_boolean.chore_' ~ i ~ '_enable') == 'on' -%}
                {%- set child_name = states('input_select.chore_' ~ i ~ '_child') -%}
                {% set chore_dict = {
                  'day': states('input_select.chore_' ~ i ~ '_day') | int(0),
                  'owner': child_name,
                  'ownerIndex': (0 if child_name == 'archie' else (1 if child_name == 'harry' else 2)),
                  'title': states('input_text.chore_' ~ i ~ '_title'),
                  'price': (states('input_number.chore_' ~ i ~ '_price') | float(0.0)),
                  'timeLimit': states('input_text.chore_' ~ i ~ '_time'),
                  'completed': states('input_boolean.chore_' ~ i ~ '_done') == 'on'
                } %}
                {% set ns.chores = ns.chores + [chore_dict] %}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.chores }}
      - name: "Archie Balance Calculated"
        unique_id: archie_balance_calculated
        unit_of_measurement: "$"
        state_class: measurement
        device_class: monetary
        state: >
          {% set total = namespace(value=0.0) %}
          {%- for i in range(1, 21) -%}
            {%- if is_state('input_boolean.chore_' ~ i ~ '_enable','on') and is_state('input_select.chore_' ~ i ~ '_child','archie') and is_state('input_boolean.chore_' ~ i ~ '_done','on') -%}
              {% set total.value = total.value + (states('input_number.chore_' ~ i ~ '_price') | float(0)) %}
            {%- endif -%}
          {%- endfor -%}
          {{ '%.2f' | format(total.value) }}
      - name: "Harry Balance Calculated"
        unique_id: harry_balance_calculated
        unit_of_measurement: "$"
        state_class: measurement
        device_class: monetary
        state: >
          {% set total = namespace(value=0.0) %}
          {%- for i in range(1, 21) -%}
            {%- if is_state('input_boolean.chore_' ~ i ~ '_enable','on') and is_state('input_select.chore_' ~ i ~ '_child','harry') and is_state('input_boolean.chore_' ~ i ~ '_done','on') -%}
              {% set total.value = total.value + (states('input_number.chore_' ~ i ~ '_price') | float(0)) %}
            {%- endif -%}
          {%- endfor -%}
          {{ '%.2f' | format(total.value) }}
      - name: "Bella Balance Calculated"
        unique_id: bella_balance_calculated
        unit_of_measurement: "$"
        state_class: measurement
        device_class: monetary
        state: >
          {% set total = namespace(value=0.0) %}
          {%- for i in range(1, 21) -%}
            {%- if is_state('input_boolean.chore_' ~ i ~ '_enable','on') and is_state('input_select.chore_' ~ i ~ '_child','bella') and is_state('input_boolean.chore_' ~ i ~ '_done','on') -%}
              {% set total.value = total.value + (states('input_number.chore_' ~ i ~ '_price') | float(0)) %}
            {%- endif -%}
          {%- endfor -%}
          {{ '%.2f' | format(total.value) }}
      - name: "ChoreBoard Open Chores"
        unique_id: choreboard_open_chores
        unit_of_measurement: "chores"
        state_class: measurement
        state: >
          {% set total = namespace(value=0) %}
          {%- for i in range(1, 21) -%}
            {%- if is_state('input_boolean.chore_' ~ i ~ '_enable','on') and is_state('input_boolean.chore_' ~ i ~ '_done','off') -%}
              {% set total.value = total.value + 1 %}
            {%- endif -%}
          {%- endfor -%}
          {{ total.value }}
      - name: "ChoreBoard Completed Chores"
        unique_id: choreboard_completed_chores
        unit_of_measurement: "chores"
        state_class: measurement
        state: >
          {% set total = namespace(value=0) %}
          {%- for i in range(1, 21) -%}
            {%- if is_state('input_boolean.chore_' ~ i ~ '_enable','on') and is_state('input_boolean.chore_' ~ i ~ '_done','on') -%}
              {% set total.value = total.value + 1 %}
            {%- endif -%}
          {%- endfor -%}
          {{ total.value }}
      - name: "ChoreBoard Archie Open"
        unique_id: choreboard_archie_open
        unit_of_measurement: "chores"
        state_class: measurement
        state: >
          {% set total = namespace(value=0) %}
          {%- for i in range(1, 21) -%}
            {%- if is_state('input_boolean.chore_' ~ i ~ '_enable','on') and is_state('input_select.chore_' ~ i ~ '_child','archie') and is_state('input_boolean.chore_' ~ i ~ '_done','off') -%}
              {% set total.value = total.value + 1 %}
            {%- endif -%}
          {%- endfor -%}
          {{ total.value }}
      - name: "ChoreBoard Harry Open"
        unique_id: choreboard_harry_open
        unit_of_measurement: "chores"
        state_class: measurement
        state: >
          {% set total = namespace(value=0) %}
          {%- for i in range(1, 21) -%}
            {%- if is_state('input_boolean.chore_' ~ i ~ '_enable','on') and is_state('input_select.chore_' ~ i ~ '_child','harry') and is_state('input_boolean.chore_' ~ i ~ '_done','off') -%}
              {% set total.value = total.value + 1 %}
            {%- endif -%}
          {%- endfor -%}
          {{ total.value }}
      - name: "ChoreBoard Bella Open"
        unique_id: choreboard_bella_open
        unit_of_measurement: "chores"
        state_class: measurement
        state: >
          {% set total = namespace(value=0) %}
          {%- for i in range(1, 21) -%}
            {%- if is_state('input_boolean.chore_' ~ i ~ '_enable','on') and is_state('input_select.chore_' ~ i ~ '_child','bella') and is_state('input_boolean.chore_' ~ i ~ '_done','off') -%}
              {% set total.value = total.value + 1 %}
            {%- endif -%}
          {%- endfor -%}
          {{ total.value }}

  - trigger:
      - platform: time_pattern
        seconds: "/5"
    sensor:
      - name: "Electricity Cost Device 5sec"
        unique_id: electricity_cost_device_5sec
        device_class: monetary
        unit_of_measurement: "$"
        state: "{{ ((states('sensor.athom_energy_monitor_029e90_power_2') | float / 720000) * (states('select.tarrif11') | float)) + (range(1,99) | random)/1000000000 }}"


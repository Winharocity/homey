    type: masonry
  - type: sections
    title: Payment
    path: payment
    icon: mdi:cash-multiple
    cards: []
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              ## 💰 Payment Processing


              When you've paid a child for their completed chores, tap their
              button below to clear all their completed chores and reset their
              balance to $0.00.


              **Note:** This only clears the "completed" status. The chores
              remain enabled and can be completed again.
      - type: grid
        cards:
          - type: heading
            heading: 👦 Archie
            heading_style: title
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.archie_balance_calculated
                name: Current Balance
                icon: mdi:cash-multiple
                icon_color: '#5e81ac'
                primary_info: state
                secondary_info: none
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: 💵 Mark Archie as Paid
            secondary: Clear all completed chores for Archie
            icon: mdi:cash-check
            tap_action:
              action: call-service
              service: script.clear_completed_chores_archie
              confirmation:
                text: Clear all completed chores for Archie?
            color: '#5e81ac'
            features_position: bottom
            grid_options:
              columns: 9
              rows: 1
          - type: heading
            heading: 👦 Harry
            heading_style: title
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.harry_balance_calculated

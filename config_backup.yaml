# Loads default set of integrations. Do not remove.
default_config:

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
  - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.10.11
    - 192.168.20.19

rest_command:
  fortigate_poe_disable_port8:
    url: "https://192.168.20.1:8443/api/v2/cmdb/switch-controller/managed-switch/S124EP5919001611/ports/port8"
    method: put
    headers:
      Authorization: "Bearer 7zsg0p9rbmk80qGzg9twcb9q9cqqmH"
      Content-Type: "application/json"
    payload: '{"poe-status":"disable"}'
    verify_ssl: false
  fortigate_poe_enable_port8:
    url: "https://192.168.20.1:8443/api/v2/cmdb/switch-controller/managed-switch/S124EP5919001611/ports/port8"
    method: put
    headers:
      Authorization: "Bearer 7zsg0p9rbmk80qGzg9twcb9q9cqqmH"
      Content-Type: "application/json"
    payload: '{"poe-status":"enable"}'
    verify_ssl: false

waste_collection_schedule:
  sources:
    - name: brisbane_qld_gov_au
      args:
        suburb: Chapel Hill
        street_name: Carissa Pl
        street_number: 7
      customize:
        - type: rubbish
          alias: Rubbish
          icon: mdi:trash-can
        - type: recycle
          alias: Recycle
          icon: mdi:recycle

homeassistant:
  auth_mfa_modules:
    - type: totp

spotcast:
  sp_dc: !secret sp_dc
  sp_key: !secret sp_key

zha:
  custom_quirks_path: /config/zhaquirks

sensor:
  - platform: time_date
    display_options:
      - 'date_time_iso'


title: ChoreBoard
views:
  - title: Overview
    path: overview
    cards:
      - type: heading
        heading: 👦 Archie
        heading_style: title
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.archie_balance_calculated
            name: Balance
            icon: mdi:cash
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.choreboard_archie_open
            name: Open Chores
            icon: mdi:clipboard-list
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
            layout: vertical
      - type: custom:mini-graph-card
        name: Balance History
        entities:
          - entity: sensor.archie_balance_calculated
            name: Archie
            color: '#4caf50'
        hours_to_show: 168
        points_per_hour: 1
        line_width: 3
        font_size: 75
        animate: true
        show:
          labels: false
          points: false
          legend: false
      - type: heading
        heading: 👦 Harry
        heading_style: title
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.harry_balance_calculated
            name: Balance
            icon: mdi:cash
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.choreboard_harry_open
            name: Open Chores
            icon: mdi:clipboard-list
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
            layout: vertical
      - type: custom:mini-graph-card
        name: Balance History
        entities:
          - entity: sensor.harry_balance_calculated
            name: Harry
            color: '#2196f3'
        hours_to_show: 168
        points_per_hour: 1
        line_width: 3
        font_size: 75
        animate: true
        show:
          labels: false
          points: false
          legend: false
      - type: heading
        heading: 👧 Bella
        heading_style: title
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.bella_balance_calculated
            name: Balance
            icon: mdi:cash
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.choreboard_bella_open
            name: Open Chores
            icon: mdi:clipboard-list
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
            layout: vertical
      - type: custom:mini-graph-card
        name: Balance History
        entities:
          - entity: sensor.bella_balance_calculated
            name: Bella
            color: '#e91e63'
        hours_to_show: 168
        points_per_hour: 1
        line_width: 3
        font_size: 75
        animate: true
        show:
          labels: false
          points: false
          legend: false
  - title: Archie
    path: archie
    icon: ''
    cards:
      - type: custom:mushroom-title-card
        title: 👦 Archie
        subtitle: Archie's Chores
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.archie_balance_calculated
            name: Balance
            icon: mdi:cash
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.choreboard_archie_open
            name: Open
            icon: mdi:clipboard-list
            icon_color: '#5e81ac'
            primary_info: state
            secondary_info: none
            layout: vertical
      - type: custom:mushroom-template-card
        primary: ➕ Add New Chore
        secondary: Tap to create a new chore slot
        icon: mdi:plus-circle
        icon_color: '#5e81ac'
        tap_action:
          action: call-service
          service: script.add_chore_archie
      - type: conditional
        conditions:
          - entity: input_boolean.chore_1_enable
            state: 'on'
          - entity: input_select.chore_1_child
            state: archie
          - condition: state
            entity: input_boolean.chore_1_done
            state: 'on'
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-template-card
              primary: '{{ states(''input_text.chore_1_title'') }}'
              secondary: >-
                Day {{ states('input_select.chore_1_day') }} | ${{
                states('input_number.chore_1_price') }} | {{
                states('input_text.chore_1_time') }}
              icon: >-
                {% if is_state('input_boolean.chore_1_done', 'on')
                %}mdi:checkbox-marked-circle{% else
                %}mdi:checkbox-blank-circle-outline{% endif %}
              icon_color: >-
                {% if is_state('input_boolean.chore_1_done', 'on') %}green{%
                else %}grey{% endif %}
              badge_icon: mdi:pencil
              badge_color: '#5e81ac'
              badge_tap_action:
                action: call-service
                service: input_boolean.toggle
                target:
                  entity_id: input_boolean.chore_1_edit_mode
              entity: input_boolean.chore_1_done
              hold_action:
                action: call-service
                service: input_boolean.toggle
                target:
                  entity_id: input_boolean.chore_1_edit_mode
              tap_action:
                action: toggle
                entity: input_boolean.chore_1_done
            - type: conditional
              conditions:
                - entity: input_boolean.chore_1_edit_mode
                  state: 'off'
              card:
                type: custom:mushroom-template-card
                primary: Edit Chore 1
                icon: mdi:pencil
                icon_color: '#5e81ac'
                tap_action:
                  action: call-service
                  service: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.chore_1_edit_mode
            - type: conditional
              conditions:
                - entity: input_boolean.chore_1_edit_mode
                  state: 'on'
              card:
                type: vertical-stack
                cards:
                  - type: custom:mushroom-title-card
                    title: ✏️ Edit chore
                    subtitle: Update details then close
                  - type: grid
                    columns: 1
                    square: false
                    cards:
                      - type: entities
                        show_header_toggle: false
                        entities:
                          - type: custom:text-input-row
                            entity: input_text.chore_1_title
                            name: Time
                            icon: mdi:clock-outline
                            placeholder: HH:MM
                      - type: grid
                        columns: 3
                        square: false
                        cards:
                          - type: custom:button-card
                            entity: input_select.chore_1_child
                            name: Archie
                            icon: mdi:account-child

                              card:
                                - padding: 6px 10px
                                - font-size: 12px
                                - min-height: 32px
                              name:
                                - font-size: 12px
                              icon:
                                - width: 16px
                                - height: 16px
                            tap_action:
                              action: call-service
                              service: input_select.select_option
                              data:
                                option: archie
                              target:
                                entity_id: input_select.chore_1_child
                            state:

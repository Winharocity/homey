                              service: input_select.select_option
                              data:
                                option: archie
                              target:
                                entity_id: input_select.chore_1_child
                          - type: template
                            entity: input_select.chore_1_child
                            content: Harry
                            icon: mdi:account-child-circle
                            tap_action:
                              action: call-service
                              service: input_select.select_option
                              data:
                                option: harry
                              target:
